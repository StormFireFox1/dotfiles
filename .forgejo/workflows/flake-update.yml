name: Flake Update

on:
  schedule:
    - cron: '0 9 * * 0'  # Every Sunday at 9 AM UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: nixos-latest
    permissions:
      contents: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Install Node.js
        run: |
          mkdir -p ~/.local/bin
          nix build -I nixpkgs=channel:nixos-unstable nixpkgs#nodejs_24 -o ~/.local/nodejs
          ln -sf ~/.local/nodejs/bin/node ~/.local/bin/node
          ln -sf ~/.local/nodejs/bin/npm ~/.local/bin/npm
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      - name: Commit and push if changed
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "actions@git.matei.lol"
          git diff --quiet flake.lock || (
            git add flake.lock &&
            git commit -m "flake: update inputs" &&
            git push
          )
      - name: Trigger build workflow
	run: |
	  curl -X POST \
	    -H "Authorization: token ${FORGEJO_TOKEN}" \
	    -H "Content-Type: application/json" \
	    "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/actions/workflows/build-cache.yaml/dispatches" \
	    -d '{"ref": "${{ forgejo.ref_name }}"}'
